<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NKAPGUARD</title>
<meta name="theme-color" content="#F2F5F3">
<link rel="preload" href="fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Jakarta";src:url(fonts/jakarta-latin.woff2) format("woff2");font-weight:200 800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Jakarta";src:url(fonts/jakarta-latin-ext.woff2) format("woff2");font-weight:200 800;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0}
:root{color-scheme:light;--bg:#F2F5F3;--card:#fff;--ink:#0E1A15;--muted:#66766F;--line:#E4E9E6;--brand:#0A5A48;--brand-2:#0E7A62;
  --ok:#16803C;--ok-soft:#E2F4E7;--warn:#A55A06;--warn-soft:#FDF0DA;--info:#0A5A48;--info-soft:#E2F2EC;--font:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0A100E;--card:#111916;--ink:#E9F0ED;--muted:#8C9D96;--line:#1F2B26;
  --ok:#4FCF83;--ok-soft:#123221;--warn:#F0A848;--warn-soft:#352610;--info:#7BE0C2;--info-soft:#11332A}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:9px;font:800 14px/1 var(--font);letter-spacing:.06em;color:var(--muted)}
.brand span{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:#fff;background:linear-gradient(145deg,var(--brand-2),var(--brand))}
.brand svg{width:17px;height:17px}
main{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px 24px;text-align:center;box-shadow:0 2px 6px rgba(14,26,21,.05),0 24px 48px -24px rgba(14,26,21,.3)}
.st{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:var(--info-soft);color:var(--info)}
.st svg{width:30px;height:30px}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)}
h1{margin:0 0 8px;font:800 23px/1.25 var(--font);letter-spacing:-.025em}
p{color:var(--muted);margin:0 0 14px}
button{width:100%;min-height:52px;margin-top:8px;padding:14px;border:0;border-radius:14px;color:#fff;background:linear-gradient(180deg,var(--brand-2),var(--brand));font:700 16px var(--font);cursor:pointer;box-shadow:0 8px 18px -10px rgba(10,90,72,.8)}
button:disabled{opacity:.6}
.foot{font-size:12.5px;color:var(--muted)}
.amount{margin:-4px 0 18px;font:800 34px/1.1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.methods{display:grid;gap:10px;margin:4px 0 14px;text-align:left}
.method{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.method .w{flex:1;min-width:0}
.method small{display:block;font:700 12px/1.3 var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.method b{display:block;margin-top:2px;font:800 19px/1.25 var(--font);letter-spacing:.01em;overflow-wrap:anywhere}
.method span{display:block;margin-top:2px;font-size:13.5px;color:var(--muted)}
.copy{flex:none;width:auto;min-height:38px;margin:0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px var(--font);box-shadow:none}
.copy.done{color:var(--ok);border-color:var(--ok)}
.reff{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px;padding:12px 14px;border-radius:14px;background:var(--info-soft);text-align:left}
.reff small{display:block;font:700 12px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.reff b{font:800 18px var(--font);letter-spacing:.12em}
label.note{display:block;margin:0 0 4px;text-align:left;font:700 13.5px var(--font);color:var(--muted)}
input.note{width:100%;min-height:48px;margin:6px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px var(--font)}
input.note:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 4px rgba(14,122,98,.16)}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="brand"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8h13l-1.1 11.1a2 2 0 0 1-2 1.9H8.6a2 2 0 0 1-2-1.9z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/><path d="m9.5 15 1.8 1.8 3.4-3.6"/></svg></span>NKAPGUARD</div>
<main id="m"><h1>NKAPGUARD</h1></main>
<script>
// Customer pages sent here by the API: offer ended, payment received, test checkout, direct payment.
(function () {
  var m = document.getElementById('m');
  var ICONS = {
    ok: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    warn: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    info: '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/>',
  };
  function draw(title, body, kind) {
    m.textContent = '';
    var st = document.createElement('div');
    st.className = 'st ' + (kind || 'info');
    st.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[kind || 'info'] + '</svg>';
    m.appendChild(st);
    var h = document.createElement('h1');
    String(title).split('\n').forEach(function (line, i) { if (i) h.appendChild(document.createElement('br')); h.appendChild(document.createTextNode(line)); });
    m.appendChild(h);
    String(body).split('\n').forEach(function (line) { var p = document.createElement('p'); p.textContent = line; m.appendChild(p); });
  }
  var data = {};
  try { data = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) { data = {}; }
  document.documentElement.lang = data.lang === 'fr+en' ? 'fr' : (data.lang || 'en');
  if (!data.title) { draw('NKAPGUARD', ''); return; }
  document.title = String(data.title).split('\n')[0];
  // A test checkout shows a card; a finished payment a tick; an offer that ended or an outage a clock.
  draw(data.title, data.body || '', data.test ? 'info' : data.status && data.status !== 200 ? 'warn' : 'ok');
  // A shop paid straight to its own number: the amount, where to send it, and "I've paid".
  var d = data.direct;
  if (d && d.methods && d.methods.length) {
    var tx = d.texts || {};
    var api = (window.NKG_API || data.api || '').replace(/\/$/, '');
    m.querySelector('.st').className = 'st ' + (d.claimed ? 'warn' : 'info');
    if (d.claimed) return;
    var intro = document.createElement('p');
    intro.textContent = tx.intro;
    m.appendChild(intro);
    function copyBtn(text) {
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'copy';
      c.textContent = tx.copy;
      c.onclick = function () {
        var done = function () { c.textContent = tx.copied; c.classList.add('done'); setTimeout(function () { c.textContent = tx.copy; c.classList.remove('done'); }, 1800); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
      };
      return c;
    }
    var list = document.createElement('div');
    list.className = 'methods';
    d.methods.forEach(function (x) {
      var row = document.createElement('div');
      row.className = 'method';
      var w = document.createElement('div');
      w.className = 'w';
      var l = document.createElement('small'); l.textContent = x.label; w.appendChild(l);
      var a = document.createElement('b'); a.textContent = x.account; w.appendChild(a);
      if (x.holder) { var hd = document.createElement('span'); hd.textContent = x.holder; w.appendChild(hd); }
      if (x.note) { var nt = document.createElement('span'); nt.textContent = x.note; w.appendChild(nt); }
      row.appendChild(w);
      row.appendChild(copyBtn(x.account.replace(/\s+/g, '')));
      list.appendChild(row);
    });
    m.appendChild(list);
    var rf = document.createElement('div');
    rf.className = 'reff';
    var rw = document.createElement('div');
    var rl = document.createElement('small'); rl.textContent = tx.refLabel; rw.appendChild(rl);
    var rv = document.createElement('b'); rv.textContent = d.ref; rw.appendChild(rv);
    rf.appendChild(rw);
    rf.appendChild(copyBtn(d.ref));
    m.appendChild(rf);
    var lab = document.createElement('label');
    lab.className = 'note';
    lab.textContent = tx.noteLabel;
    var inp = document.createElement('input');
    inp.className = 'note';
    inp.maxLength = 80;
    inp.autocomplete = 'off';
    lab.appendChild(inp);
    m.appendChild(lab);
    var go = document.createElement('button');
    go.textContent = tx.claim;
    go.onclick = function () {
      go.disabled = true;
      fetch(api + '/pay/' + encodeURIComponent(d.payRef) + '/claim', { method: 'POST', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify({ note: inp.value }) })
        .then(function (r) { return r.json(); })
        .then(function (r) { draw(r.title, r.body, r.outcome === 'claimed' ? 'ok' : 'warn'); })
        .catch(function () { go.disabled = false; });
    };
    m.appendChild(go);
    return;
  }
  if (data.test && data.test.ref) {
    var b = document.createElement('button');
    b.textContent = data.test.pay;
    b.onclick = function () {
      b.disabled = true;
      var api = (window.NKG_API || '').replace(/\/$/, '');
      fetch(api + '/pay/' + encodeURIComponent(data.test.ref) + '/test', { method: 'POST', headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (r) { draw(r.title, r.body, 'ok'); })
        .catch(function () { b.disabled = false; });
    };
    m.appendChild(b);
  }
})();
</script>
</body>
</html>
